# Alembic configuration for fin-tracker.
#
# IMPORTANT: do NOT set sqlalchemy.url here. The URL comes from
# app.core.config.get_settings().database_url and is wired into alembic
# at runtime by env.py. Keeping it blank here means dev / test / prod
# can never drift between the app and migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# Left unset (not blank) deliberately: alembic 1.19 treats an empty string as
# "not None" and crashes trying ZoneInfo(""); None takes its naive-datetime.now()
# path instead. Matches this repo's naive-UTC-only convention (ADR-0001 rule 5) --
# affects only the cosmetic "# Create Date:" comment in generated migration files.
# timezone =
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_locations = %(here)s/alembic/versions
path_separator = os
output_encoding = utf-8

sqlalchemy.url =


[post_write_hooks]
# (ruff format is run by pre-commit; no Alembic post-write hook needed)


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
