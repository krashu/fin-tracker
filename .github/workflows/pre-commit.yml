name: Pre-Commit Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pre-commit:
    name: Repository Syntax & Formatting Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run repo-wide pre-commit hooks
        # Skip domain-specific system hooks that are already executed in test-backend.yml, test-frontend.yml, and security.yml
        env:
          SKIP: ruff,ruff-format,ty,eslint,typecheck,fixture-redaction
        run: pre-commit run --all-files --show-diff-on-failure
