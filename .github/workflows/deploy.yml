name: Deploy Full-Stack (FastAPI Cloud)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-fastapi-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose File Syntax
        run: docker compose config --quiet

      - name: Build Docker Compose Images
        run: docker compose build --pull

  test-backend:
    name: Test Backend (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run python -m ty check app --output-format github

      - name: Run backend tests
        run: uv run pytest -n auto

  test-frontend:
    name: Test Frontend (Next.js & Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  security-audit:
    name: Security & Fixture Redaction
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for unredacted .env files
        run: |
          if find . -type f -name ".env*" ! -name ".env.example" | grep -q .; then
            echo "::error::Found committed .env files. Never commit private .env files!"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run PII Redaction Fixture Guard
        working-directory: backend
        run: uv run pytest tests/test_fixture_redaction.py -q --no-cov

  deploy:
    name: Build Frontend & Deploy to FastAPI Cloud
    needs: [validate-docker, test-backend, test-frontend, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build static frontend for unified deployment
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "/api/v1"
        run: pnpm build

      - name: Stage frontend assets into backend/frontend_dist
        run: |
          mkdir -p backend/frontend_dist
          cp -r frontend/out/* backend/frontend_dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install backend dependencies (locked)
        working-directory: backend
        run: uv sync --locked

      - name: Pre-deploy backend quality gate
        working-directory: backend
        run: |
          uv run ruff check .
          uv run python -m ty check app --output-format github

      - name: Deploy to FastAPI Cloud
        working-directory: backend
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy
